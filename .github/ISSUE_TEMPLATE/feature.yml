name: Engineering task
description: Implement a scoped TradeCore feature
labels: [enhancement]
body:
  - type: textarea
    id: context
    attributes:
      label: Business context
      description: Why does this feature exist?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Specify testable outcomes and edge cases
      placeholder: "- [ ] Given X, when Y, then Z"
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Proposed technical approach
      description: Explain decisions, complexity, and tradeoffs
  - type: textarea
    id: tests
    attributes:
      label: Test plan
      description: Include success, failure, and boundary conditions
